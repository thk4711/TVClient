# Direct-boot development layout with separate data, not the production A/B contract.
image data.ext4 {
    ext4 { label = "satip-data" use-mke2fs = true }
    size = 256M
    mountpoint = "/data"
}
image boot.vfat {
    vfat {
        file Image { image = "Image" }
        file bcm2711-rpi-4-b.dtb { image = "bcm2711-rpi-4-b.dtb" }
        file start4.elf { image = "rpi-firmware/start4.elf" }
        file fixup4.dat { image = "rpi-firmware/fixup4.dat" }
        file config.txt { image = "rpi-firmware/config.txt" }
        file cmdline.txt { image = "rpi-firmware/cmdline.txt" }
        file overlays { image = "rpi-firmware/overlays" }
        file satip-config.txt { image = "satip-config.txt" }
    }
    size = 128M
}
image sdcard.img {
    hdimage { partition-table-type = "mbr" }
    partition boot {
        partition-type = 0xC
        bootable = true
        offset = 1M
        image = "boot.vfat"
    }
    partition rootfs {
        partition-type = 0x83
        image = "rootfs.ext4"
    }
    partition data {
        partition-type = 0x83
        image = "data.ext4"
    }
}
