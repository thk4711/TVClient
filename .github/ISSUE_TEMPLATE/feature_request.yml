name: Feature request
description: Suggest an enhancement for the appliance or build
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, follow SECURITY.md instead. Do not attach credentials, device exports, raw logs or private screenshots."
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What are you trying to do, and what is missing or hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like. Note any hardware or source dependencies.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why the proposal is preferable.
    validations:
      required: false
